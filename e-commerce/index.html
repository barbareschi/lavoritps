<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-Tech Store - Catalogo Hardware</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.4.1/jspdf.debug.js" crossorigin="anonymous"></script>
    <!-- Font moderno e pulito (Inter) per una resa visiva nettamente superiore -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
       
        body { 
            background-color: #121824; 
            font-family: 'Inter', sans-serif; 
            padding: 30px; 
            color: #f8fafc; 
            margin: 0;
        }

        h2 {
            font-size: 26px;
            font-weight: 700;
            color: #0284c7;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

     
        .upload-container {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: inline-block;
            margin-bottom: 30px;
        }

        .upload-container label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #94a3b8;
            font-size: 14px;
        }

        input[type="file"] {
            color: #94a3b8;
            font-size: 14px;
        }

    
        #contenitore { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 25px; 
            margin-bottom: 40px;
        }

       
        .blocco { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-radius: 16px; 
            padding: 20px; 
            color: #1e293b; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .blocco:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            border-color: #bae6fd;
        }

        .blocco img { 
            width: 100%; 
            height: 140px; 
            object-fit: contain; 
            background-color: #f8fafc;
            border-radius: 8px;
            margin-bottom: 15px; 
        }

        .blocco p {
            margin: 5px 0;
            font-size: 14px;
        }

        .blocco p b {
            font-size: 16px;
            color: #0f172a;
        }

        
        button { 
            cursor: pointer; 
            width: 100%; 
            margin-top: 8px; 
            padding: 10px; 
            font-weight: 600; 
            font-size: 14px;
            border: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        
        .blocco button:nth-of-type(1) {
            background: #0284c7;
            color: white;
        }
        .blocco button:nth-of-type(1):hover {
            background: #0369a1;
        }

       
        .blocco button:nth-of-type(2) {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
        .blocco button:nth-of-type(2):hover {
            background: #e2e8f0;
        }

        
        #area-carrello { 
            background: #1e293b; 
            color: #f8fafc; 
            padding: 25px; 
            margin-top: 40px; 
            border-radius: 16px; 
            border: 1px solid #334155; 
            max-width: 600px;
        }

        #area-carrello h3 {
            margin-top: 0;
            font-size: 20px;
            color: #0284c7;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        #lista-carrello p {
            font-size: 14px;
            background: #111827;
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
            border-left: 4px solid #ef4444; 
        }

        #area-carrello hr {
            border: 0;
            border-top: 1px solid #334155;
            margin: 20px 0;
        }

        
        .info-box { 
            display: none; 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 500px;
            background: #ffffff; 
            color: #1e293b; 
            padding: 30px; 
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 99; 
        }

        .info-box h2 {
            color: #0f172a;
            margin-top: 0;
        }

        .info-box p {
            font-size: 15px;
            line-height: 1.5;
            color: #475569;
        }

        .info-box .modal-close-btn {
            background: #ef4444;
            color: white;
            margin-top: 20px;
        }
        .info-box .modal-close-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

<div class="upload-container">
    <label for="inputDati">Carica Catalogo Componenti (.csv)</label>
    <input type="file" id="inputDati" accept=".csv">
</div>

<div id="contenitore"></div>


<div id="finestra" class="info-box"></div>


<div id="area-carrello">
    <h3>Carrello</h3>
    <div id="lista-carrello"></div>
    <hr>
    <p style="font-size: 18px;"><b>Totale: <span id="euro" style="color: #ef4444;">0</span> €</b></p>
    <button onclick="calcola_totale(0,0,'')" style="background:#22c55e; color:white; font-size:15px;">Calcola Totale</button>
    <button id="btn-stampa" onclick="genera_pdf_jspdf()" style="background:#3b82f6; color:white; margin-top:12px; display:none; font-size:15px;">Procedi all'Acquisto (Genera PDF)</button>
</div>

<script>

var elenco_prod = [];
var carrello = [];

document.getElementById("inputDati").addEventListener("change", function(e){
    var lettore = new FileReader();
    lettore.onload = function(evento){
        var testo = evento.target.result;
        var righe = testo.replace(/\r/g, "").split("\n");
        carica_dati(righe, 1); 
    };
    lettore.readAsText(e.target.files[0]);
});


function carica_dati(righe, i){
    if(i >= righe.length){
        disegna_tutto(0);
        return;
    }
    var colonne = righe[i].split(";");
    if(colonne.length >= 5 && colonne[0] != ""){
        elenco_prod.push({
            m: colonne[0].trim(),
            mo: colonne[1].trim(),
            de: colonne[2].trim(),
            im: colonne[3].trim(),
            pr: colonne[4].trim()
        });
    }
    carica_dati(righe, i + 1);
}


function disegna_tutto(pos){
    if(pos >= elenco_prod.length) return;
    
    var cont = document.getElementById("contenitore");
    var div = document.createElement("div");
    div.className = "blocco";
    
    div.innerHTML = "<img src='"+elenco_prod[pos].im+"'>" +
                    "<p><b>"+elenco_prod[pos].m+"</b></p>" +
                    "<p>"+elenco_prod[pos].mo+"</p>" +
                    "<button onclick='apri("+pos+")'>Dettagli</button>" +
                    "<button onclick='metti_nel_carrello("+pos+")'>Aggiungi</button>";
    
    cont.appendChild(div);
    disegna_tutto(pos + 1);
}


function apri(id){
    var f = document.getElementById("finestra");
    f.style.display = "block";
    f.innerHTML = "<h2>"+elenco_prod[id].m+" "+elenco_prod[id].mo+"</h2>" +
                  "<p>"+elenco_prod[id].de+"</p>" +
                  "<p style='font-weight:bold; font-size:18px; color:#0284c7;'>Prezzo: "+elenco_prod[id].pr+" €</p>" +
                  "<button class='modal-close-btn' onclick='this.parentElement.style.display=\"none\"'>Chiudi</button>";
}

function metti_nel_carrello(id){
    carrello.push(elenco_prod[id]);
}


function calcola_totale(n, tot, stringa){
    if(n >= carrello.length){
        document.getElementById("lista-carrello").innerHTML = stringa;
        document.getElementById("euro").innerText = tot.toFixed(2);
        document.getElementById("btn-stampa").style.display = "block";
        return;
    }
    
    var p = parseFloat(carrello[n].pr.replace(",", "."));
    var riga = "<p>"+carrello[n].m+" "+carrello[n].mo+" - "+carrello[n].pr+" €</p>";
    
    calcola_totale(n + 1, tot + p, stringa + riga);
}


function genera_pdf_jspdf(){
    var doc = new jsPDF();
    doc.text("RICEVUTA D'ACQUISTO - NEO-TECH STORE", 15, 20);
    doc.text("-----------------------------------------", 15, 27);
    
    scrivi_righe_pdf(doc, 0, 35);
}

function scrivi_righe_pdf(doc, n, y){
    if(n >= carrello.length){
        var totale = document.getElementById("euro").innerText;
        doc.text("-----------------------------------------", 15, y);
        doc.text("Totale: " + totale + " EUR", 15, y + 10);
        doc.save("ricevuta_acquisto.pdf");
        return;
    }
    
    var rigaTesto = carrello[n].m + " " + carrello[n].mo + " - " + carrello[n].pr + " EUR";
    doc.text(rigaTesto, 15, y);
    
    scrivi_righe_pdf(doc, n + 1, y + 10);
}
</script>

</body>
</html>
