<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-Tech Store - Catalogo Hardware</title>
   
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.4.1/jspdf.debug.js" crossorigin="anonymous"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
       
        body { 
            background: radial-gradient(circle at top center, #1e293b 0%, #0f172a 100%);
            font-family: 'Plus Jakarta Sans', sans-serif; 
            padding: 40px; 
            color: #f8fafc; 
            margin: 0;
            min-height: 100vh;
        }

       
        .store-header {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #0369a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: -0.5px;
        }

        
        .upload-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .upload-container label {
            font-weight: 500;
            color: #94a3b8;
            font-size: 14px;
        }

        input[type="file"] {
            color: #38bdf8;
            font-size: 14px;
            cursor: pointer;
        }

        
        #contenitore { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 30px; 
            max-width: 1200px;
            margin: 0 auto 50px auto;
        }

       
        .blocco { 
            background: #ffffff; 
            border: 1px solid #f1f5f9; 
            border-radius: 20px; 
            padding: 24px; 
            color: #0f172a; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .blocco:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px -10px rgba(56, 189, 248, 0.2);
            border-color: #e0f2fe;
        }

       
        .blocco img { 
            width: 100%; 
            height: 150px; 
            object-fit: contain; 
            background: radial-gradient(circle, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 14px;
            margin-bottom: 20px; 
            transition: transform 0.3s ease;
        }

        .blocco:hover img {
            transform: scale(1.03);
        }

        .product-info {
            margin-bottom: 20px;
        }

        .blocco p {
            margin: 4px 0;
        }

        .blocco p b {
            font-size: 18px;
            color: #0f172a;
            letter-spacing: -0.3px;
            display: block;
            margin-bottom: 2px;
        }

        .product-model {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
        }

       
        button { 
            cursor: pointer; 
            width: 100%; 
            padding: 12px; 
            font-weight: 600; 
            font-size: 14px;
            border: none;
            border-radius: 10px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        
        .blocco button:nth-of-type(1) {
            background: #0f172a;
            color: white;
            margin-bottom: 8px;
        }
        .blocco button:nth-of-type(1):hover {
            background: #334155;
        }

  
        .blocco button:nth-of-type(2) {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }
        .blocco button:nth-of-type(2):hover {
            background: #dcfce7;
            transform: scale(1.02);
        }

        
        #area-carrello { 
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            color: #f8fafc; 
            padding: 30px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
        }

        #area-carrello h3 {
            margin-top: 0;
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: -0.5px;
        }

       
        #lista-carrello p {
            font-size: 14px;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 16px;
            border-radius: 12px;
            margin: 10px 0;
            border-left: 4px solid #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #area-carrello hr {
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 25px 0;
        }

        .total-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            margin-bottom: 20px;
        }

       
        .btn-calc {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: white;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2);
        }
        .btn-calc:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.3);
        }

       
        .btn-pdf {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            margin-top: 14px;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }
        .btn-pdf:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
        }

       
        .info-box { 
            display: none; 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 460px;
            background: #ffffff; 
            color: #0f172a; 
            padding: 35px; 
            border-radius: 24px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
            z-index: 99; 
            border: 1px solid #f1f5f9;
        }

        .info-box h2 {
            background: none;
            -webkit-text-fill-color: initial;
            color: #0f172a;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .info-box p {
            font-size: 15px;
            line-height: 1.6;
            color: #475569;
            margin-bottom: 20px;
        }

        .info-box .modal-close-btn {
            background: #ef4444;
            color: white;
        }
        .info-box .modal-close-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

<div class="store-header">
    <h2>NEO-Tech Store</h2>
    <div class="upload-container">
        <label for="inputDati">Catalogo Componenti</label>
        <input type="file" id="inputDati" accept=".csv">
    </div>
</div>

<div id="contenitore"></div>


<div id="finestra" class="info-box"></div>


<div id="area-carrello">
    <h3>Carrello</h3>
    <div id="lista-carrello"></div>
    <hr>
    <div class="total-wrapper">
        <span>Totale da saldare:</span>
        <b><span id="euro" style="color: #38bdf8; font-size: 24px;">0.00</span> €</b>
    </div>
    <button class="btn-calc" onclick="calcola_totale(0,0,'')">Calcola Totale</button>
    <button id="btn-stampa" class="btn-pdf" onclick="genera_pdf_jspdf()" style="display:none;">Procedi all'Acquisto (Genera PDF)</button>
</div>

<script>

var elenco_prod = [];
var carrello = [];

document.getElementById("inputDati").addEventListener("change", function(e){
    var lettore = new FileReader();
    lettore.onload = function(evento){
        var testo = evento.target.result;
        var righe = testo.replace(/\r/g, "").split("\n");
        carica_dati(righe, 1); 
    };
    lettore.readAsText(e.target.files[0]);
});

function carica_dati(righe, i){
    if(i >= righe.length){
        disegna_tutto(0);
        return;
    }
    var colonne = righe[i].split(";");
    if(colonne.length >= 5 && colonne[0] != ""){
        elenco_prod.push({
            m: colonne[0].trim(),
            mo: colonne[1].trim(),
            de: colonne[2].trim(),
            im: colonne[3].trim(),
            pr: colonne[4].trim()
        });
    }
    carica_dati(righe, i + 1);
}

function disegna_tutto(pos){
    if(pos >= elenco_prod.length) return;
    
    var cont = document.getElementById("contenitore");
    var div = document.createElement("div");
    div.className = "blocco";
    
    div.innerHTML = "<img src='"+elenco_prod[pos].im+"'>" +
                    "<div class='product-info'>" +
                    "<p><b>"+elenco_prod[pos].m+"</b></p>" +
                    "<p class='product-model'>"+elenco_prod[pos].mo+"</p>" +
                    "</div>" +
                    "<div>" +
                    "<button onclick='apri("+pos+")'>Dettagli</button>" +
                    "<button onclick='metti_nel_carrello("+pos+")'>Aggiungi</button>" +
                    "</div>";
    
    cont.appendChild(div);
    disegna_tutto(pos + 1);
}

function apri(id){
    var f = document.getElementById("finestra");
    f.style.display = "block";
    f.innerHTML = "<h2>"+elenco_prod[id].m+" "+elenco_prod[id].mo+"</h2>" +
                  "<p>"+elenco_prod[id].de+"</p>" +
                  "<p style='font-weight:700; font-size:20px; color:#0284c7; margin-bottom:20px;'>Prezzo: "+elenco_prod[id].pr+" €</p>" +
                  "<button class='modal-close-btn' onclick='this.parentElement.style.display=\"none\"'>Chiudi Finestra</button>";
}

function metti_nel_carrello(id){
    carrello.push(elenco_prod[id]);
}

function calcola_totale(n, tot, stringa){
    if(n >= carrello.length){
        document.getElementById("lista-carrello").innerHTML = stringa;
        document.getElementById("euro").innerText = tot.toFixed(2);
        document.getElementById("btn-stampa").style.display = "block";
        return;
    }
    
    var prezzoPulito = carrello[n].pr.replace(",", ".").trim();
    var p = parseFloat(prezzoPulito);
    
    if (isNaN(p)) {
        p = 0;
    }
    
   
    var riga = "<p><span>"+carrello[n].m+" "+carrello[n].mo+"</span> <b style='color:#38bdf8'>"+carrello[n].pr+" €</b></p>";
    
    calcola_totale(n + 1, tot + p, stringa + riga);
}

function genera_pdf_jspdf(){
    var doc = new jsPDF();
    doc.text("RICEVUTA D'ACQUISTO - NEO-TECH STORE", 15, 20);
    doc.text("-----------------------------------------", 15, 27);
    scrivi_righe_pdf(doc, 0, 35);
}

function scrivi_righe_pdf(doc, n, y){
    if(n >= carrello.length){
        var totale = document.getElementById("euro").innerText;
        doc.text("-----------------------------------------", 15, y);
        doc.text("Totale: " + totale + " EUR", 15, y + 10);
        doc.save("ricevuta_acquisto.pdf");
        return;
    }
    
    var rigaTesto = carrello[n].m + " " + carrello[n].mo + " - " + carrello[n].pr + " EUR";
    doc.text(rigaTesto, 15, y);
    scrivi_righe_pdf(doc, n + 1, y + 10);
}
</script>

</body>
</html>
